<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100% 100%">
      <stop offset="0%" stop-color="#0C8F63"/>
      <stop offset="100%" stop-color="#0A6FE8"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3DDBA0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3DDBA0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#dots)"/>
  <circle cx="310" cy="110" r="150" fill="url(#orb)" filter="url(#blur)">
    <animate attributeName="r" values="140;170;140" dur="7.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;1;0.65" dur="7.0s" repeatCount="indefinite"/>
  </circle>
  <rect width="400" height="500" fill="#000000" fill-opacity="0.08"/>

  <g transform="translate(68.0,108.0)" filter="url(#iconGlow)">
    <animateTransform attributeName="transform" type="translate"
      values="68.0,108.0; 68.0,98.0; 68.0,108.0"
      dur="5.3s" repeatCount="indefinite" additive="sum"/>
    <g transform="scale(11)" fill="none" stroke="#ffffff" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9.5" y="1.5" width="5" height="2.5" rx="0.8"/><path d="M10 4h4l1.2 3a2 2 0 0 1 .15.75V20a1.8 1.8 0 0 1-1.8 1.8h-2.7A1.8 1.8 0 0 1 9 20V7.75a2 2 0 0 1 .15-.75z"/><line x1="8.7" y1="12.5" x2="15.3" y2="12.5"/><line x1="9" y1="9.5" x2="15" y2="9.5"/>
    </g>
  </g>
</svg>