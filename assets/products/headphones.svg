<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100% 100%">
      <stop offset="0%" stop-color="#0FB87A"/>
      <stop offset="100%" stop-color="#0A5FC4"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3DDBA0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3DDBA0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#dots)"/>
  <circle cx="300" cy="120" r="150" fill="url(#orb)" filter="url(#blur)">
    <animate attributeName="r" values="140;170;140" dur="6.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;1;0.65" dur="6.0s" repeatCount="indefinite"/>
  </circle>
  <rect width="400" height="500" fill="#000000" fill-opacity="0.08"/>

  <g transform="translate(68.0,108.0)" filter="url(#iconGlow)">
    <animateTransform attributeName="transform" type="translate"
      values="68.0,108.0; 68.0,98.0; 68.0,108.0"
      dur="4.5s" repeatCount="indefinite" additive="sum"/>
    <g transform="scale(11)" fill="none" stroke="#ffffff" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
    </g>
  </g>
</svg>