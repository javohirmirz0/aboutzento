<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100% 100%">
      <stop offset="0%" stop-color="#083B8C"/>
      <stop offset="100%" stop-color="#0A6FE8"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4D93F2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4D93F2" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#dots)"/>
  <circle cx="90" cy="100" r="150" fill="url(#orb)" filter="url(#blur)">
    <animate attributeName="r" values="140;170;140" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;1;0.65" dur="7.5s" repeatCount="indefinite"/>
  </circle>
  <rect width="400" height="500" fill="#000000" fill-opacity="0.08"/>

  <g transform="translate(68.0,108.0)" filter="url(#iconGlow)">
    <animateTransform attributeName="transform" type="translate"
      values="68.0,108.0; 68.0,98.0; 68.0,108.0"
      dur="4.5s" repeatCount="indefinite" additive="sum"/>
    <g transform="scale(11)" fill="none" stroke="#ffffff" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="2" width="12" height="20" rx="2"/><line x1="10.5" y1="18.3" x2="13.5" y2="18.3"/>
    </g>
  </g>
</svg>